# Release changelog used by GitHub release workflow.
# Add one section per version under [releases."<version>"].

[releases."0.3.0"]
title = "Initial testing release"
message = "First packaged pre-release intended for internal validation and feedback."
prerelease = true
changes = [
  "Initial testing release for limnd2.",
  "Includes reader and writer support for Nikon NIS-Elements .nd2 files.",
  "Includes compatibility access through the ND2File wrapper.",
  "Includes conversion/export tooling and example scripts.",
]

[releases."0.4.0"]
title = "Tag-driven releases and CI/CD alignment"
message = "This release migrates limnd2 to tag-derived versioning and a repeatable GitHub-based validation and release flow. It also aligns supported Python versions, packaging metadata, and maintainer workflows with the current dependency and release model."
prerelease = false
changes = [
  "Versions are now derived from immutable Git tags.",
  "CI now runs the fast test suite on Linux and Windows for Python 3.11 through 3.14.",
  "Added Python 3.14 support, including compatible locked dependencies.",
  "CI now validates package builds, wheel installation, and documentation builds.",
  "Releases are now created from pushed version tags through a single GitHub workflow.",
  "Added an advisory mypy workflow and a separate compatibility test workflow.",
  "Updated release messaging to match the new tag-based release process.",
  "Added direct downsampled decoding for RLE binary label chunks.",
  "Image information now reports complete or partial multi-resolution image data.",
  "Aligned Python support metadata and maintainer workflow documentation with the current release process.",
]

[releases."0.4.1"]
title = "Improved OME-Zarr display windows"
message = "OME-Zarr exports now derive useful display windows from image data when an ND2 file does not provide a channel-specific display range."
prerelease = false
changes = [
  "OME-Zarr exports now sample image data to set display windows for channels with fallback ND2 ranges.",
  "Preserved independent channel display metadata for each exported image group.",
]

[releases."0.4.2"]
title = "Several bug fixes and improvements"
prerelease = false
changes = [
  "BUG FIX: In .nd2 -> .png / .jpg image export (fixed issues with incorect bit depth).",
  "FEATURE: Added code to generate / check / remove downsamples (use `limnd2.generate_downsamples`, `limnd2.remove_downsamples` and `limnd2.downsample_info`).",
  "FEATURE: Image info can now also be read from .tiff and .ome.tiff files.",
]

[releases."0.4.3"]
title = "Metadata export and large-image improvements"
message = "This release improves OME-Zarr exports and TIFF image inspection, and makes downsample generation more practical for large uncompressed ND2 images."
prerelease = false
changes = [
  "FEATURE: Added import and export support for the ND2 metadata JSON sidecar format.",
  "FEATURE: OME-Zarr exports now include a versioned `nd2_chunks` JSON files containing decoded ND2 metadata.",
  "FEATURE: Image info now reports multi-resolution pyramid data for TIFF and OME-TIFF files.",
  "FEATURE: Downsample generation now processes large uncompressed ND2 images in memory-bounded stripes, with tiled pyramid writes and progress updates.",
]

[releases."0.4.4"]
title = "Wellplate metadata and conversion improvements"
message = "This release simplifies reading, creating, and writing wellplate metadata, and expands wellplate support in image-sequence conversion."
prerelease = false
changes = [
  "FEATURE: Added a combined Wellplate object and Nd2Reader.wellplate and Nd2Writer.wellplate properties.",
  "FEATURE: WellplateFactory now calculates physical well indexes and supports automatic frame numbering, lists of wells, and rectangular well regions.",
  "FEATURE: convert_sequence_to_nd2 now accepts a wellplate object directly.",
  "FEATURE: The sequence conversion CLI can map multipoint positions to an explicit wellplate range, including partially filled ranges and time or Z dimensions.",
  "FEATURE: Added methods to read binary layers from associated H5 result files.",
  "API CHANGE: Removed WellplateFactory.addGrid; use addWell with a list or addWellRect for a rectangular region.",
  "API CHANGE: Removed the sequence conversion CLI row and column naming options; CLI-generated wellplates use lettered rows and numbered columns.",
  "FEATURE: Added wellplate documentation and reader, factory, and CLI conversion tests.",
]

