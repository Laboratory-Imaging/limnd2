# Release changelog used by GitHub release workflow.
# Add one section per version under [releases."<version>"].

[releases."0.3.0"]
title = "Initial testing release"
message = "First packaged pre-release intended for internal validation and feedback."
prerelease = true
changes = [
  "Initial testing release for limnd2.",
  "Includes reader and writer support for Nikon NIS-Elements .nd2 files.",
  "Includes compatibility access through the ND2File wrapper.",
  "Includes conversion/export tooling and example scripts.",
]

[releases."0.4.0"]
title = "Tag-driven releases and CI/CD alignment"
message = "This release migrates limnd2 to tag-derived versioning and a repeatable GitHub-based validation and release flow. It also aligns supported Python versions, packaging metadata, and maintainer workflows with the current dependency and release model."
prerelease = false
changes = [
  "Versions are now derived from immutable Git tags.",
  "CI now runs the fast test suite on Linux and Windows for Python 3.11, 3.12, and 3.13.",
  "CI now validates package builds, wheel installation, and documentation builds.",
  "Releases are now created from pushed version tags through a single GitHub workflow.",
  "Added an advisory mypy workflow and a separate compatibility test workflow.",
  "Updated release messaging to match the new tag-based release process.",
  "Aligned Python support metadata and maintainer workflow documentation with the current release process.",
]

