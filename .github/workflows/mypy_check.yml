name: Advisory Type Check

on:
  push:
    branches: [ main ]
    paths:
      - 'src/limnd2/**/*.py'
      - 'pyproject.toml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/limnd2/**/*.py'
      - 'pyproject.toml'

jobs:
  mypy-report:
    name: Generate mypy report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: uv sync --extra dev

      - name: Run mypy on limnd2 only and capture output
        run: |
          uv run mypy src/limnd2 > mypy.log 2>&1 || true

      - name: Upload mypy.log artifact
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: mypy.log
